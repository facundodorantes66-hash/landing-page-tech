<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Calificaciones</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>Registro de Calificaciones</h1>

    <form id="formulario">
        <label for="nombre">Nombre del Alumno:</label>
        <input type="text" id="nombre" required>

        <label for="matematicas">Matemáticas:</label>
        <input type="number" id="matematicas" min="0" max="10" step="0.1" required>

        <label for="espanol">Español:</label>
        <input type="number" id="espanol" min="0" max="10" step="0.1" required>

        <label for="historia">Historia:</label>
        <input type="number" id="historia" min="0" max="10" step="0.1" required>

        <button type="submit">Guardar</button>
    </form>

    <h2>Alumnos registrados</h2>
    <div id="listaAlumnos">
        <p class="sin-registros">Aún no hay alumnos registrados.</p>
    </div>

    <script src="Scrip.js"></script>
</body>
</html>
